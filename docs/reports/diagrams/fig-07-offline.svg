ize="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">written; conflicts surfaced to</text><text x="933" y="160.264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">staff</text><rect x="1077" y="199" width="36" height="14" rx="7" ry="7" fill="#E4F5F3" stroke="#0D9488" stroke-width="0.8"/><text x="1095" y="209" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0D9488" text-anchor="middle">SYNC</text><line x1="242" y1="160" x2="256" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="462" y1="160" x2="476" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="682" y1="160" x2="696" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="902" y1="160" x2="916" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="262" width="346.6666666666667" height="92" rx="8" ry="8" fill="#EAF0FA" stroke="#C7D2DE" stroke-width="1.2"/><rect x="40" y="262" width="4" height="92" rx="2" ry="2" fill="#0F2942"/><text x="53" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0F2942" text-anchor="start">Why it matters at Lawas</text><text x="53" y="294" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">Rural connectivity interruptions must not stop dispensing,</text><text x="53" y="307.132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">oxygen dispatch or key custody.</text><rect x="406.6666666666667" y="262" width="346.6666666666667" height="92" rx="8" ry="8" fill="#EAF0FA" stroke="#C7D2DE" stroke-width="1.2"/><rect x="406.6666666666667" y="262" width="4" height="92" rx="2" ry="2" fill="#0F2942"/><text x="419.6666666666667" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0F2942" text-anchor="start">Data integrity guard</text><text x="419.6666666666667" y="294" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">Writes that cannot be queued are reported as failures instead</text><text x="419.6666666666667" y="307.132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">of silent success.</text><rect x="773.3333333333334" y="262" width="346.6666666666667" height="92" rx="8" ry="8" fill="#EAF0FA" stroke="#C7D2DE" stroke-width="1.2"/><rect x="773.3333333333334" y="262" width="4" height="92" rx="2" ry="2" fill="#0F2942"/><text x="786.3333333333334" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0F2942" text-anchor="start">Audit continuity</text><text x="786.3333333333334" y="294" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">Replayed transactions carry the same audit trail as online</text><text x="786.3333333333334" y="307.132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" fill="#5B6B7C" text-anchor="start">writes.</text><text x="40" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Source: src/services/offlinePreloader.ts, offlineAdapter.ts, offlineQueue.ts, offlineFetch.ts.</text></svg>