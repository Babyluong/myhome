<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660"><rect x="0" y="0" width="1160" height="660" rx="0" ry="0" fill="#FFFFFF"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0F2942" text-anchor="start">Figure 10: What H.O.M.E. brings to each user group</text><line x1="40" y1="55" x2="172" y2="55" stroke="#0D9488" stroke-width="3"/><text x="40" y="73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Benefits are stated per role so department heads can see their own value proposition</text><rect x="40" y="98" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="40" y="98" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="53" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">Hospital Director</text><text x="53" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">One dashboard for operations, budget and audit posture;</text><text x="53" y="143.668" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">approvals tracked end to end.</text><text x="53" y="235.33333333333334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MyWarrant, MyAdmin, Reports</text><rect x="406" y="98" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="406" y="98" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="419" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">Pharmacist</text><text x="419" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">Formulary, dilution and LASA guidance at the point of care;</text><text x="419" y="143.668" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">quota and alternatives in seconds.</text><text x="419" y="235.33333333333334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MyFormulari, MyPrepacking</text><rect x="772" y="98" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="772" y="98" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="785" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">Store keeper</text><text x="785" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">QR ledger replaces ink cards; counts, FEFO and variances</text><text x="785" y="143.668" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">handled by the system.</text><text x="785" y="235.33333333333334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MyInventory, MyCylinder</text><rect x="40" y="263.33333333333337" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="40" y="263.33333333333337" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="53" y="281.33333333333337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">Ward sister / nurse</text><text x="53" y="295.33333333333337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">Indent against entitlement; oxygen and porter requests with</text><text x="53" y="309.0013333333334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">visible status.</text><text x="53" y="400.66666666666674" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">Distribution, MyPorter, MyCylinder</text><rect x="406" y="263.33333333333337" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="406" y="263.33333333333337" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="419" y="281.33333333333337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">Driver &amp; porter</text><text x="419" y="295.33333333333337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">Dispatch queue, roster and vehicle issues on one screen</text><text x="419" y="309.0013333333334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">instead of radio calls.</text><text x="419" y="400.66666666666674" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MyTransporter, MyPorter</text><rect x="772" y="263.33333333333337" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="772" y="263.33333333333337" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="785" y="281.33333333333337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">Facility officer</text><text x="785" y="295.33333333333337" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">Cold-chain breaches and key custody answered with evidence,</text><text x="785" y="309.0013333333334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">not memory.</text><text x="785" y="400.66666666666674" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MySuhu, MyKunci, MyTempahan</text><rect x="40" y="428.6666666666667" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="40" y="428.6666666666667" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="53" y="446.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">HR &amp; administration</text><text x="53" y="460.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">Movement, leave, time-off and org chart maintained in one</text><text x="53" y="474.3346666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">place.</text><text x="53" y="566" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MyStaff, MyTimeOff</text><rect x="406" y="428.6666666666667" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="406" y="428.6666666666667" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="419" y="446.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">Quality / MSQH team</text><text x="419" y="460.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">Audit trail, breach logs and printable official records on</text><text x="419" y="474.3346666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">demand.</text><text x="419" y="566" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MyAdmin, MySuhu, MyKunci</text><rect x="772" y="428.6666666666667" width="348" height="149.33333333333334" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.3"/><rect x="772" y="428.6666666666667" width="4" height="149.33333333333334" rx="2" ry="2" fill="#0F2942"/><text x="785" y="446.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F2942" text-anchor="start">System administrator</text><text x="785" y="460.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">Accounts, RBAC matrix, logs, backups and release broadcasts</text><text x="785" y="474.3346666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" fill="#5B6B7C" text-anchor="start">centrally controlled.</text><text x="785" y="566" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0D9488" text-anchor="start">MyAdmin, Backups, Releases</text><text x="40" y="604" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Module attribution follows the hub catalogue and registry role presets; benefit statements describe implemented functionality.</text></svg>