goe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">contact, photo</text><rect x="223.66666666666666" y="102" width="161.66666666666666" height="118" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.2"/><rect x="223.66666666666666" y="102" width="4" height="118" rx="2" ry="2" fill="#0F2942"/><text x="236.66666666666666" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0F2942" text-anchor="start">2. Admin verification</text><text x="236.66666666666666" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">Hospital or system admin</text><text x="236.66666666666666" y="147.4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">reviews and approves the</text><text x="236.66666666666666" y="160.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">request</text><rect x="407.3333333333333" y="102" width="161.66666666666666" height="118" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.2"/><rect x="407.3333333333333" y="102" width="4" height="118" rx="2" ry="2" fill="#0F2942"/><text x="420.3333333333333" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0F2942" text-anchor="start">3. Account provisioning</text><text x="420.3333333333333" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">Employee ID generated;</text><text x="420.3333333333333" y="147.4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">credential issued via</text><text x="420.3333333333333" y="160.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">secure channel</text><rect x="591" y="102" width="161.66666666666666" height="118" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.2"/><rect x="591" y="102" width="4" height="118" rx="2" ry="2" fill="#0F2942"/><text x="604" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0F2942" text-anchor="start">4. Role assignment</text><text x="604" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">Role mapped to 7 action</text><text x="604" y="147.4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">types in the RBAC matrix</text><rect x="774.6666666666666" y="102" width="161.66666666666666" height="118" rx="8" ry="8" fill="#FFFFFF" stroke="#C7D2DE" stroke-width="1.2"/><rect x="774.6666666666666" y="102" width="4" height="118" rx="2" ry="2" fill="#0F2942"/><text x="787.6666666666666" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0F2942" text-anchor="start">5. Module enforcement</text><text x="787.6666666666666" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">Routes and actions gated</text><text x="787.6666666666666" y="147.4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">by role, module and</text><text x="787.6666666666666" y="160.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">hospital scope</text><rect x="958.3333333333333" y="102" width="161.66666666666666" height="118" rx="8" ry="8" fill="#