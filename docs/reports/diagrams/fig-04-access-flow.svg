l, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">248 policies enforce tenant scope inside PostgreSQL</text><line x1="212.66666666666666" y1="258" x2="212.66666666666666" y2="234" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="407.3333333333333" y="260" width="345.3333333333333" height="96" rx="8" ry="8" fill="#FDF3E3" stroke="#C7D2DE" stroke-width="1.2"/><rect x="407.3333333333333" y="260" width="4" height="96" rx="2" ry="2" fill="#B45309"/><text x="420.3333333333333" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0F2942" text-anchor="start">Edge Functions</text><text x="420.3333333333333" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">Privileged admin operations run server-side with the service</text><text x="420.3333333333333" y="305.4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">role</text><line x1="580" y1="258" x2="580" y2="234" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="774.6666666666666" y="260" width="345.3333333333333" height="96" rx="8" ry="8" fill="#FDF3E3" stroke="#C7D2DE" stroke-width="1.2"/><rect x="774.6666666666666" y="260" width="4" height="96" rx="2" ry="2" fill="#B45309"/><text x="787.6666666666666" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#0F2942" text-anchor="start">Session controls</text><text x="787.6666666666666" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#5B6B7C" text-anchor="start">Failed-attempt lockout, session timeout and password policy</text><line x1="947.3333333333333" y1="258" x2="947.3333333333333" y2="234" stroke="#B45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="40" y="390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5B6B7C" text-anchor="start">The same matrix drives the hub tiles, route guards and per-action buttons, so a permission change is reflected everywhere at once.</text><text x="40" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Source: src/modules/auth, src/modules/admin, src/shared/constants/moduleRegistry.ts, supabase/migrations.</text></svg>